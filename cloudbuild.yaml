timeout: '1200s'

steps:
- name: 'gcr.io/cloud-builders/docker'
  id: 'Build and push'
  entrypoint: 'bash'
  env:
    # This affects the docker client, not script args
    - 'DOCKER_CLI_EXPERIMENTAL=enabled'
  args:
    - 'scripts/build_docker.sh'
    # Boolean flags
    - '--remote_source'
    - '--push'
    # GCB user-defined substitutions
    - '--ar_region=${_AR_REGION}'
    - '--ar_repository=${_AR_REPOSITORY}'
    - '--image_name=${_IMAGE_NAME}'
    - '--tag=${_TAG}'
    - '--extra_tags=${_EXTRA_TAGS}'
    - '--platforms=${_PLATFORMS}'
    - '--project_id=${_PROJECT_ID}'
    # GCB Built-in substitutions
    - '--short_sha=${SHORT_SHA}'
    - '--branch_name=${BRANCH_NAME}'

substitutions:
  _AR_REGION: "us"
  _PROJECT_ID: "cros-passport"
  _AR_REPOSITORY: "passport"
  _IMAGE_NAME: "passport"
  _TAG: "staging"
  _EXTRA_TAGS: "autopush"
  _PLATFORMS: "linux/amd64,linux/arm64"

options:
  logging: CLOUD_LOGGING_ONLY

# Note: images can't be used with multi-arch images.
